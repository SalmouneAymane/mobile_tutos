<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catégories | Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 text-gray-900 antialiased">
    <div class="min-h-screen lg:flex">
        <aside class="hidden w-64 shrink-0 flex-col bg-gray-800 p-6 text-white lg:flex">
            <a href="#categories" class="mb-10 text-xl font-bold tracking-tight">Studio<span class="text-blue-400">.</span></a>
            <p class="mb-3 text-xs font-semibold uppercase text-gray-400">Espace de travail</p>
            <nav class="space-y-1" aria-label="Navigation principale">
                <a href="#dashboard" class="block rounded-lg px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white">Tableau de bord</a>
                <a href="#categories" aria-current="page" class="block rounded-lg bg-blue-600 px-4 py-3 font-medium text-white">Catégories</a>
                <a href="#products" class="block rounded-lg px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white">Produits</a>
                <a href="#settings" class="block rounded-lg px-4 py-3 text-gray-300 hover:bg-gray-700 hover:text-white">Paramètres</a>
            </nav>
            <div class="mt-auto border-t border-gray-700 pt-5 text-sm text-gray-400">Gestion du catalogue</div>
        </aside>

        <div class="flex min-h-screen min-w-0 flex-1 flex-col">
            <header class="border-b border-gray-200 bg-white shadow-sm">
                <div class="flex min-h-16 items-center justify-between gap-4 px-4 sm:px-6 lg:px-8">
                    <div>
                        <p class="text-xs font-medium uppercase text-gray-500 lg:hidden">Studio</p>
                        <h1 class="text-lg font-semibold">Gestion des catégories</h1>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="hidden text-sm text-gray-600 sm:inline">Administrateur</span>
                        <div class="flex h-9 w-9 items-center justify-center rounded-full bg-blue-100 text-sm font-semibold text-blue-700" aria-label="Profil administrateur">AD</div>
                    </div>
                </div>
                <nav class="flex gap-2 overflow-x-auto border-t border-gray-100 px-4 py-2 lg:hidden" aria-label="Navigation mobile">
                    <a href="#dashboard" class="whitespace-nowrap rounded-lg px-3 py-2 text-sm text-gray-600 hover:bg-gray-100">Tableau de bord</a>
                    <a href="#categories" aria-current="page" class="whitespace-nowrap rounded-lg bg-blue-600 px-3 py-2 text-sm font-medium text-white">Catégories</a>
                    <a href="#products" class="whitespace-nowrap rounded-lg px-3 py-2 text-sm text-gray-600 hover:bg-gray-100">Produits</a>
                    <a href="#settings" class="whitespace-nowrap rounded-lg px-3 py-2 text-sm text-gray-600 hover:bg-gray-100">Paramètres</a>
                </nav>
            </header>

            <main id="categories" class="w-full flex-1 p-4 sm:p-6 lg:p-8">
                <div class="mx-auto max-w-5xl">
                    <div class="mb-6 flex flex-wrap items-center justify-between gap-4">
                        <div>
                            <p class="text-sm text-gray-500">Catalogue</p>
                            <h2 class="mt-1 text-2xl font-bold">Catégories</h2>
                        </div>
                        <button id="btn_show_form" type="button" class="rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">Nouvelle catégorie</button>
                    </div>

                    <form id="section_form" hidden class="mb-6 grid gap-4 rounded-lg border border-gray-200 bg-white p-5 shadow-sm sm:grid-cols-2">
                        <label class="text-sm font-medium text-gray-700">Nom
                            <input type="text" name="name" id="form_name" class="mt-2 w-full rounded-lg border border-gray-300 px-3 py-2.5 font-normal focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                        </label>
                        <label class="text-sm font-medium text-gray-700">Couleur
                            <input type="text" name="color" id="form_color" class="mt-2 w-full rounded-lg border border-gray-300 px-3 py-2.5 font-normal focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                        </label>
                        <div class="flex justify-end gap-3 sm:col-span-2">
                            <button id="btn_cancel_form" type="button" class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">Annuler</button>
                            <button id="btn_submit_form" type="submit" class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">Enregistrer</button>
                        </div>
                    </form>

                    <section class="overflow-hidden rounded-lg border border-gray-200 bg-white shadow-sm" aria-label="Liste des catégories">
                        <div class="border-b border-gray-200 px-5 py-4">
                            <h3 class="font-semibold">Toutes les catégories</h3>
                        </div>
                        <div class="overflow-x-auto">
                            <table id="table" class="w-full min-w-[480px] text-left text-sm">
                                <thead class="bg-gray-50 text-xs uppercase text-gray-500">
                                    <tr>
                                        <th scope="col" class="px-5 py-3 font-semibold">Nom</th>
                                        <th scope="col" class="px-5 py-3 font-semibold">Couleur</th>
                                        <th scope="col" class="px-5 py-3 font-semibold">Action</th>
                                    </tr>
                                </thead>
                                <tbody id="table_body" class="divide-y divide-gray-100"></tbody>
                            </table>
                        </div>
                    </section>
                </div>
            </main>
        </div>
    </div>
    <script src="js/func.js"></script>
</body>
</html>
